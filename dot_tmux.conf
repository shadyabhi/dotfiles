# ===========================================================================
# General Settings
# ===========================================================================
set -g prefix ^a
unbind %
set-option -sg escape-time 10
set -g base-index 1
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -g set-titles on
set -g set-titles-string "#T"
set -g mouse on
set -g focus-events on
#set -g mouse-select-pane on

# Send to inner tmux session. On A, not a: prefix+a opens the annotations overlay.
bind-key A send-prefix

# ===========================================================================
# Window & Activity Notifications
# ===========================================================================

# Keep manually-set window titles; don't auto-rename to current folder
setw -g automatic-rename off
set -g allow-rename off

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# ===========================================================================
# Vi Mode & Copy/Paste
# ===========================================================================

# vim mode
set-window-option -g mode-keys vi

# Treat anything without whitespace as a word (for select-word)
set -g word-separators " "

# Enter copy mode with prefix + y
bind-key y copy-mode

# In copy mode, press y to show copy menu
bind-key -T copy-mode-vi y display-menu -T "Copy" \
    "Selection"      y "send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "Word"           w "send-keys -X select-word \; send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "Line"           l "send-keys -X select-line \; send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "All"            a "send-keys -X cancel \; capture-pane -J \; save-buffer - \; delete-buffer \; run-shell 'tmux save-buffer - | pbcopy'" \
    ""               "" "" \
    "URL"            u "send-keys -X cancel \; display-popup -E \"tmux capture-pane -p -J -t #{pane_id} | grep -oE 'https?://[^ ]+' | sort -u | fzf --reverse --prompt='URL> ' | tr -d '\\n' | pbcopy\"" \
    "IP Address"     i "send-keys -X cancel \; display-popup -E \"tmux capture-pane -p -J -t #{pane_id} | grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+' | sort -u | fzf --reverse --prompt='IP> ' | tr -d '\\n' | pbcopy\"" \
    "File Path"      p "send-keys -X cancel \; display-popup -E \"tmux capture-pane -p -J -t #{pane_id} | grep -oE '(\\./|/)[^ :]+' | sort -u | fzf --reverse --prompt='Path> ' | tr -d '\\n' | pbcopy\"" \
    ""               "" "" \
    "Cmd Output"     o "send-keys -X cancel \; display-popup -w 80% -h 80% -E \"~/.tmux/scripts/copy-last-cmds.py #{pane_id}\""

# solve tmux problems on mac (with pbpaste etc)
# set-option -g default-command "reattach-to-user-namespace -l zsh" # or bash
bind C-c run "tmux show-buffer | reattach-to-user-namespace pbcopy"
bind C-v run "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"

# ===========================================================================
# Navigation
# ===========================================================================

# Goto last active window
bind-key C-a last-window

# Vim bindings to select pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Shift+arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# List windows
bind-key L list-windows

# Quick window preview & select (no prefix). choose-tree -Zw shows a window
# tree with a live preview pane; Enter switches, / filters, j/k navigate.
bind -n C-s choose-tree -Zw

# ===========================================================================
# Panes - Splitting, Resizing & Moving
# ===========================================================================

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -c '#{pane_current_path}' -v
bind v split-window -c '#{pane_current_path}' -h

# Moving panes around
bind-key b break-pane
bind < resize-pane -L 10
bind > resize-pane -R 10
# Move this pane into another window: pick the placement, then the window.
# The menu must come first -- tmux silently ignores display-menu/command-prompt
# invoked from a choose-tree Enter callback.
# -f spans the full window edge instead of splitting the target's active pane.
bind-key m display-menu -T "Join pane where?" -x C -y C \
    "Right" r "choose-tree -Zw \"join-pane -fh  -t '%%'\"" \
    "Left"  h "choose-tree -Zw \"join-pane -fhb -t '%%'\"" \
    "Below" j "choose-tree -Zw \"join-pane -fv  -t '%%'\"" \
    "Above" k "choose-tree -Zw \"join-pane -fvb -t '%%'\""

# ===========================================================================
# Windows
# ===========================================================================
unbind c
bind c new-window -c '#{pane_current_path}'

# ===========================================================================
# Sessions
# ===========================================================================
bind-key C-r command-prompt -I "#{session_name}" -p "New session name:" "rename-session '%%'"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# ===========================================================================
# Miscellaneous Bindings
# ===========================================================================

# Quickly open URLs
bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; display-popup -E 'bash -i -c "cat /tmp/tmux-buffer | urlview"'

# Popups
bind C-p popup -d '#{pane_current_path}'

# ===========================================================================
# Terminal Features
# ===========================================================================

# Pass Shift+Enter through to applications (e.g. Claude Code)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Let terminal graphics escape sequences (image.nvim) pass through to the
# outer terminal. Required for image rendering from inside tmux.
set -gq allow-passthrough on

# ===========================================================================
# Status Bar
# ===========================================================================
set-option -g status on
set-option -g status-interval 2
set-option -g status-justify "centre"
set-option -g status-left-length 60
set-option -g status-right-length 90
set -g status-bg black
set -g status-fg white
set -g status-position top

# ===========================================================================
# Plugins (TPM)
# ===========================================================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set-option -g @plugin 'b0o/tmux-autoreload'
# Must stay after catppuccin: catppuccin overwrites status-right wholesale and
# would drop the annotations counter segment.
set -g @plugin 'jnsahaj/tmux-annotations'

# Annotate and toggle the overlay both on 'a' (separate key tables).
# send-prefix moved to prefix+A to free this up.
set -g @annotations-key 'a'
set -g @annotations-view-key 'a'

# Catppuccin theme config
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_default_text "   #W   "
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text "   #[bold]#W#{?window_zoomed_flag,(),}#[nobold]   "
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_window_status_style "rounded" # can comment this out

# Initialize TPM (keep at end of plugin section)
run '~/.tmux/plugins/tpm/tpm'

# ===========================================================================
# Post-TPM Overrides (after TPM to avoid plugin overrides)
# ===========================================================================

# Thicker, more visible pane borders
set -g pane-border-lines heavy
set -g pane-border-style fg=colour52
set -g pane-active-border-style fg=colour196

# Dim inactive panes to highlight the active one
# bg=default preserves terminal (iTerm) transparency
set -g window-style 'fg=colour250,bg=default'
set -g window-active-style 'fg=colour255,bg=default'

bind p previous-window

# Window management
bind-key C-b break-pane

# recon
bind -n C-g display-popup -E -w 80% -h 60% "recon view"

# tmux-annotations skips installing this itself: its guard only matches the
# pre-3.6 default (select-window), but tmux 3.6 defaults to switch-client.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},annotations}' \
  'run -b "~/.tmux/plugins/tmux-annotations/scripts/view.sh"' \
  'switch-client -t ='

set -g status-right-length 200
if -F '#{!=:#{@summary_added},1}' {
  set -ag status-right " | #(~/scripts/claude/summary.sh)"
  set -g @summary_added 1
}
